<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miniaturas YT — GameStore</title>
    <link rel="icon" type="image/png" href="./img/NEOCRAFT.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <style>
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 24px;
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
        }
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
        .header p { color: var(--text3); font-size: 14px; }
        
        .input-group { margin-bottom: 24px; }
        .input-label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
        .input-box {
            display: flex;
            gap: 10px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px;
        }
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            padding: 8px;
            font-size: 15px;
        }
        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-action:hover { background: var(--accent2); }

        #result { margin-top: 32px; display: none; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .preview-img {
            width: 100%;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .copy-box {
            background: var(--bg2);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .copy-box code { flex: 1; font-size: 12px; color: var(--accent2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .back-nav {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <script src="./js/auth.js"></script>

    <nav class="back-nav">
        <a href="profile.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <span style="font-weight: 700; font-size: 18px;">Miniaturas YT</span>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Obtener Miniatura</h1>
            <p>Pega el enlace de YouTube para extraer la imagen</p>
        </div>

        <div class="input-group">
            <label class="input-label">URL del Video</label>
            <div class="input-box">
                <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
                <button class="btn-action" onclick="getThumbnail()">Obtener</button>
            </div>
        </div>

        <div id="result">
            <img id="preview" class="preview-img" src="" alt="Preview">
            <div class="copy-box">
                <code id="thumbUrl"></code>
                <button class="btn-action" style="padding: 6px 12px; font-size: 12px;" onclick="copyUrl()">Copiar</button>
            </div>
        </div>
    </div>

    <script>
        function getThumbnail() {
            const url = document.getElementById('ytUrl').value;
            const videoId = getVideoID(url);
            
            if (videoId) {
                const thumb = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
                document.getElementById('preview').src = thumb;
                document.getElementById('thumbUrl').innerText = thumb;
                document.getElementById('result').style.display = 'block';
            } else {
                alert('URL de YouTube no válida');
            }
        }

        function getVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function copyUrl() {
            const text = document.getElementById('thumbUrl').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('Enlace copiado al portapapeles');
            });
        }
    </script>
</body>
</html>
