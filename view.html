<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detalle — GameStore</title>
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/png" href="./img/NEOCRAFT.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="detail-nav">
    <button class="back-btn" onclick="goBack()" aria-label="Volver">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="detail-nav-title" id="navTitle">GameStore</span>
    <button class="back-btn" onclick="openShare()" aria-label="Compartir" style="margin-left:auto;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
  </nav>

  <!-- Content -->
  <div class="detail-page" id="addonDetails">
    <!-- Skeleton loader -->
    <div style="padding:20px 16px;">
      <div style="display:flex;gap:16px;margin-bottom:20px;">
        <div class="skeleton" style="width:88px;height:88px;border-radius:20%;flex-shrink:0;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px;">
          <div class="skeleton skeleton-line" style="width:70%;height:18px;"></div>
          <div class="skeleton skeleton-line" style="width:45%;height:13px;"></div>
          <div class="skeleton skeleton-line" style="width:55%;height:13px;"></div>
        </div>
      </div>
      <div class="skeleton" style="width:100%;height:48px;border-radius:14px;margin-bottom:16px;"></div>
      <div class="skeleton skeleton-line" style="width:100%;height:13px;margin-bottom:6px;"></div>
      <div class="skeleton skeleton-line" style="width:85%;height:13px;margin-bottom:6px;"></div>
      <div class="skeleton skeleton-line" style="width:90%;height:13px;"></div>
    </div>
  </div>

  <!-- Share Sheet -->
  <div class="share-sheet" id="shareSheet" style="display:none;" onclick="closeShareSheet()">
    <div class="share-sheet-inner" onclick="event.stopPropagation()">
      <div class="share-handle"></div>
      <p class="share-title">Compartir</p>
      <div class="share-options">
        <a class="share-option" id="shareWhatsApp" href="#" target="_blank" rel="noopener">
          <div class="share-option-icon" style="background:#25d366;">
            <img src="./img/whatsapp.png" width="28" alt="WhatsApp" onerror="this.style.display='none';this.parentElement.textContent='💬'">
          </div>
          <span class="share-option-label">WhatsApp</span>
        </a>
        <a class="share-option" id="shareTelegram" href="#" target="_blank" rel="noopener">
          <div class="share-option-icon" style="background:#2aabee;">
            <img src="./img/telegram.png" width="28" alt="Telegram" onerror="this.style.display='none';this.parentElement.textContent='✈️'">
          </div>
          <span class="share-option-label">Telegram</span>
        </a>
        <div class="share-option" onclick="copyLink()">
          <div class="share-option-icon" style="background:#6c63ff;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </div>
          <span class="share-option-label">Copiar link</span>
        </div>
        <div class="share-option" onclick="closeShareSheet()">
          <div class="share-option-icon" style="background:#333;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </div>
          <span class="share-option-label">Cerrar</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="./js/data.js"></script>
  <script src="./js/view.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
