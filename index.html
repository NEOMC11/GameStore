<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GameStore — Apps & Juegos</title>
  <meta name="description" content="Descarga las mejores apps, juegos, texturas y shaders para Minecraft y Craftsman. Curado por NEOMC11.">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/png" href="./img/NEOCRAFT.png">
  <link rel="apple-touch-icon" href="./img/NEOCRAFT.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="#" class="navbar-brand" onclick="scrollToTop(); return false;">
      <img src="./img/NEOCRAFT.png" alt="GameStore" class="navbar-logo">
      <span class="navbar-title">GameStore</span>
    </a>
    <div class="navbar-actions">
      <img src="./img/profile/NEOMC11.png" alt="Perfil" class="navbar-avatar" onclick="goToProfile()" title="Ver perfil">
    </div>
  </nav>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar apps, juegos, texturas..." autocomplete="off" spellcheck="false">
      <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="Limpiar búsqueda">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Chips -->
  <div class="chips-wrap" id="chipsWrap">
    <div class="chips" id="chipsContainer">
      <!-- Dinámico -->
    </div>
  </div>

  <!-- Main Content -->
  <main id="mainContent">
    <!-- Dinámico -->
  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="showHome()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Inicio</span>
    </button>
    <button class="nav-item" id="nav-apps" onclick="showApps()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
      <span>Apps</span>
    </button>
    <button class="nav-item" id="nav-videos" onclick="showVideos()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 8l6 4-6 4V8z"/><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg>
      <span>Videos</span>
    </button>
    <button class="nav-item" id="nav-profile" onclick="goToProfile()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      <span>Tú</span>
      <span class="nav-dot"></span>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
  <script>
    // Registro del Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
