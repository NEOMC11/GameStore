<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso — GameStore</title>
    <link rel="icon" type="image/png" href="./img/NEOCRAFT.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--bg);
            min-height: 100vh;
            padding-bottom: 20px;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: var(--shadow-card);
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-glow);
        }
        .login-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text);
        }
        .login-subtitle {
            font-size: 14px;
            color: var(--text3);
            margin-bottom: 32px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text2);
            margin-bottom: 8px;
            margin-left: 4px;
        }
        .input-field {
            width: 100%;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            transition: var(--transition);
        }
        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .btn-login {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
        }
        .btn-login:hover {
            background: var(--accent2);
            transform: translateY(-2px);
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="./img/NEOCRAFT.png" alt="Logo" class="login-logo">
        <h1 class="login-title">Acceso Privado</h1>
        <p class="login-subtitle">Ingresa tus credenciales de NEO</p>
        
        <div id="errorMsg" class="error-msg">Usuario o contraseña incorrectos</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Usuario</label>
                <input type="text" id="username" class="input-field" placeholder="Nombre de usuario" required>
            </div>
            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>

    <script>
        const _u = "TkVP";
        const _p = "Z2FlbHp1bGU=";

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if (u === atob(_u) && p === atob(_p)) {
                const authData = btoa(JSON.stringify({ user: u, pass: p, time: Date.now() }));
                localStorage.setItem('gamestore_auth', authData);
                
                // Redirigir a la página previa o al perfil
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('ref') || 'profile.html';
                window.location.href = redirect;
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
